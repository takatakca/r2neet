<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2547">
<title>My cleanings — R2NETTE</title>
<link rel="icon" href="/assets/brand/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2547;--ink:#0A2547;--deep:#0B4DA2;--blue:#1F8FE0;--electric:#3BA9F5;
  --teal:#12A79B;--green:#3FAE49;--lime:#8BC63F;--gold:#FFC627;
  --paper:#FBFCFD;--mist:#EDF4FA;--line:#D7E5F0;--muted:#54708C;--danger:#C4383C;
  --e:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--smooth:cubic-bezier(.4,0,.2,1);
  --t-fast:140ms;--t-base:240ms;
  --e1:0 1px 2px rgba(10,37,71,.06),0 2px 6px rgba(10,37,71,.05);
  --e2:0 2px 6px rgba(10,37,71,.07),0 8px 20px rgba(10,37,71,.07);
  --e4:0 12px 32px rgba(10,37,71,.16),0 40px 80px rgba(10,37,71,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;
font-size:16px;line-height:1.5;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;letter-spacing:-.028em;line-height:1.05;margin:0;text-wrap:balance}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}
header{background:linear-gradient(165deg,#0B4DA2,#0A2547);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 30px;position:relative;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;height:52px}
.hd>*{min-width:0}
.logo img{height:32px;display:block}
.hd-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1px solid rgba(255,255,255,.22);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:7px 11px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.65)}
.lang button[aria-pressed="true"]{background:var(--teal);color:#fff}
header h1{font-size:clamp(26px,6.5vw,36px);margin-top:14px}
header .sub{opacity:.8;margin-top:6px;font-size:15px}
.bub{position:absolute;border-radius:50%;pointer-events:none;
background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.4),rgba(160,220,255,.12) 46%,transparent 70%);
border:1px solid rgba(255,255,255,.16)}
.tabs{display:flex;gap:6px;margin:22px 0 20px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:12px 4px;margin-right:20px;font-weight:700;font-size:14.5px;
color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;transition:color var(--t-base)}
.tab.on{color:var(--deep);border-bottom-color:var(--teal)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--e1);
padding:20px;margin-bottom:14px;transition:box-shadow var(--t-base) var(--smooth)}
.card:hover{box-shadow:var(--e2)}
.card.next{background:linear-gradient(150deg,#0B4DA2,#0A2547);color:#fff;border:0;box-shadow:var(--e4);position:relative;overflow:hidden}
.row1{display:grid;gap:12px}
@media(min-width:520px){.row1{grid-template-columns:auto 1fr;gap:16px;align-items:start}}
.when{display:flex;align-items:baseline;gap:10px}
@media(min-width:520px){.when{display:block;min-width:104px}}
.when .d{font-size:12px;text-transform:uppercase;letter-spacing:.07em;opacity:.7;font-weight:700}
.when .t{font-family:'JetBrains Mono';font-weight:700;font-size:22px}
@media(min-width:520px){.when .t{margin-top:4px}}
.info{flex:1;min-width:0}
.info{min-width:0}
.info b{display:block;font-size:16.5px;line-height:1.2}
.info span{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.info span.mono{white-space:nowrap}
.card.next .info span{color:rgba(255,255,255,.75)}
.pill{display:inline-block;padding:4px 11px;border-radius:99px;font-size:11px;font-weight:800;
letter-spacing:.04em;white-space:nowrap}
.pill.ok{background:rgba(18,167,155,.14);color:#0B7A72}
.pill.gold{background:rgba(255,198,39,.2);color:#8A6100}
.pill.mut{background:var(--mist);color:var(--muted)}
.pill.bad{background:rgba(196,56,60,.12);color:var(--danger)}
.card.next .pill{background:rgba(255,255,255,.16);color:#fff}
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14.5px;
display:inline-flex;align-items:center;gap:8px;text-decoration:none;
transition:transform var(--t-fast) var(--spring),box-shadow var(--t-base)}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#3FAE49,#12A79B);color:#fff;box-shadow:0 4px 14px rgba(18,167,155,.34)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-compact{padding:9px 15px;font-size:13.5px;white-space:nowrap}
.card.next .btn-ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.26);color:#fff}
.btn-quiet{background:none;border:0;color:var(--muted);text-decoration:underline;padding:12px 4px;font-size:14px}
.btn-danger{background:rgba(196,56,60,.1);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{background:var(--mist);border-radius:12px;padding:14px;font-size:13.5px;color:var(--muted);line-height:1.5}
.card.next .note{background:rgba(255,255,255,.12);color:rgba(255,255,255,.85)}
.empty{text-align:center;padding:44px 20px;background:var(--mist);border-radius:18px}
.empty .ic{font-size:36px;margin-bottom:12px;opacity:.75}
.empty .t{font-weight:600;margin-bottom:6px}
.empty .s{color:var(--muted);font-size:14.5px;margin-bottom:18px}
.sk{background:linear-gradient(90deg,var(--mist) 25%,#F6FAFD 50%,var(--mist) 75%);
background-size:220% 100%;animation:shimmer 1.3s linear infinite;border-radius:16px;height:120px;margin-bottom:14px}
@keyframes shimmer{to{background-position:-220% 0}}
.section{margin-bottom:26px}
.section h2{font-size:19px;margin-bottom:12px}
.addr{display:flex;align-items:center;gap:12px}
.addr .t{flex:1;min-width:0}
.addr .t b{display:block;font-size:15px}
.addr .t span{font-size:13.5px;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(10,37,71,.55);backdrop-filter:blur(4px);z-index:90;
display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
@media(min-width:700px){.scrim.on{align-items:center}}
.sheet{background:#fff;border-radius:26px 26px 0 0;max-width:460px;width:100%;
padding:28px 22px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--e4);max-height:90vh;overflow-y:auto}
@media(min-width:700px){.sheet{border-radius:26px}}
.sheet h2{font-size:23px;margin-bottom:8px}
.sheet p.s{color:var(--muted);font-size:14.5px;margin:0 0 18px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;min-width:74px;padding:12px 8px;border:1.5px solid var(--line);border-radius:14px;background:#fff;text-align:center}
.day[aria-pressed="true"]{border-color:var(--teal);background:rgba(18,167,155,.09)}
.day .w{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase}
.day .n{display:block;font-size:19px;font-weight:700;margin-top:2px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.slot{padding:15px 6px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:14.5px}
.slot[aria-pressed="true"]{border-color:var(--teal);background:rgba(18,167,155,.12);color:var(--deep)}
.err{color:var(--danger);font-size:13.5px;margin-top:10px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-14px);
z-index:100;background:linear-gradient(135deg,#0B4DA2,#0A2547);color:#fff;border-radius:14px;padding:13px 18px;
box-shadow:var(--e4);border:1px solid rgba(255,255,255,.14);font-size:14.5px;opacity:0;pointer-events:none;
transition:opacity var(--t-base),transform 420ms var(--spring);max-width:calc(100vw - 28px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pane{display:none}.pane.on{display:block}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
  <script type="module" crossorigin src="/assets/account-BL5FUwVv.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-DMbLeIef.js">
</head>
<body>
<header>
  <span class="bub" style="width:120px;height:120px;top:-30px;right:-24px"></span>
  <span class="bub" style="width:46px;height:46px;top:44%;right:22%"></span>
  <div class="wrap">
    <div class="hd">
      <a class="logo" href="/book"><img src="/assets/brand/r2nette-logo-white.svg" alt="R2NETTE"
        onerror="this.style.display='none'"></a>
      <div class="hd-r">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-action="set-locale" data-locale="en">EN</button>
          <button type="button" data-action="set-locale" data-locale="fr">FR</button>
        </div>
        <a class="btn btn-ghost btn-compact" href="/book" data-t="account.bookNewShort">Book</a>
      </div>
    </div>
    <h1 id="greeting" data-t="account.title">My cleanings</h1>
    <div class="sub" id="subline"></div>
  </div>
</header>

<main class="wrap">
  <div class="tabs">
    <button class="tab on" data-action="tab" data-pane="upcoming" data-t="account.upcoming">Upcoming</button>
    <button class="tab" data-action="tab" data-pane="past" data-t="account.past">Past</button>
    <button class="tab" data-action="tab" data-pane="settings" data-t="account.settings">Settings</button>
  </div>

  <div id="upcoming" class="pane on"><div class="sk"></div><div class="sk"></div></div>
  <div id="past" class="pane"></div>
  <div id="settings" class="pane"></div>
</main>

<div class="scrim" id="sheet"><div class="sheet" role="dialog" aria-modal="true"><div id="sheetBody"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

</body>
</html>
