<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07283F">
  <title>You're offline — R2NETTE</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:#fbfcfd;color:#0a2547;font:16px/1.5 system-ui,sans-serif;text-align:center}
    main{max-width:420px}img{width:76px;height:76px}h1{font-size:clamp(28px,8vw,40px);line-height:1.1}
    p{color:#54708c}button{border:0;border-radius:999px;padding:14px 24px;background:#0b4da2;color:white;
    font:inherit;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="/assets/brand/pwa-icon.svg" alt="">
    <h1>You're offline</h1>
    <p>Reconnect to the internet to see current prices, available times, and complete a booking.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
