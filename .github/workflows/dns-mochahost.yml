name: DNS (MochaHost)

# Point the domain at the VPS through cPanel's API, keeping email at
# MochaHost. Run `plan` first (read-only), then `email`, then `web`.
# See scripts/deploy/mochahost-dns.py for exactly what each phase changes.
# Needs MOCHAHOST_CPANEL_HOST, MOCHAHOST_CPANEL_USER and MOCHAHOST_CPANEL_TOKEN
# (cPanel > Security > Manage API Tokens) in the `production` environment.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain, e.g. r2nette.ca
        required: true
        type: string
      mode:
        description: plan (read-only), email, or web
        required: true
        type: choice
        options: [plan, email, web]

concurrency:
  group: dns-${{ inputs.domain }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dns:
    name: ${{ inputs.mode }}
    # Only main's scripts may run with root and cPanel credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ${{ inputs.mode }}
        env:
          MODE: ${{ inputs.mode }}
          DOMAIN: ${{ inputs.domain }}
          SERVER_IP: ${{ secrets.CONTABO_SSH_HOST }}
          CPANEL_HOST: ${{ secrets.MOCHAHOST_CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.MOCHAHOST_CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.MOCHAHOST_CPANEL_TOKEN }}
        run: python3 scripts/deploy/mochahost-dns.py

      - name: The new server answers for the domain
        if: always()
        env:
          DOMAIN: ${{ inputs.domain }}
          SERVER_IP: ${{ secrets.CONTABO_SSH_HOST }}
        run: |
          # Ask the VPS directly as if DNS already pointed there, so routing
          # through its proxy is proven before the web phase moves the site.
          # Status codes only; -k because the certificate is only issued once
          # DNS points at the server.
          [ -n "$SERVER_IP" ] || { echo "CONTABO_SSH_HOST is not set."; exit 0; }
          for url in "http://$DOMAIN/healthz" "https://$DOMAIN/healthz" "https://$DOMAIN/readyz" "https://$DOMAIN/" "https://www.$DOMAIN/"; do
            host="${url#*://}"; host="${host%%/*}"
            case "$url" in https*) port=443 ;; *) port=80 ;; esac
            code="$(curl -sk -o /dev/null --max-time 20 -w '%{http_code} -> %{redirect_url}' \
              --resolve "$host:$port:$SERVER_IP" "$url" || true)"
            echo "$url: $code"
          done
          # The certificate the server presents for the domain: Let's Encrypt
          # once issued, the proxy's own default certificate before that.
          for name in "$DOMAIN" "www.$DOMAIN"; do
            cert="$(echo | timeout 15 openssl s_client -connect "$SERVER_IP:443" -servername "$name" 2>/dev/null \
              | openssl x509 -noout -subject -issuer -enddate 2>/dev/null | tr '\n' ';' || true)"
            echo "Certificate for $name: ${cert:-none}"
          done

      - name: What the internet sees now
        if: always()
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          for t in A MX; do echo "$DOMAIN $t: $(dig +short "$DOMAIN" "$t" | tr '\n' ' ')"; done
          echo "www.$DOMAIN: $(dig +short "www.$DOMAIN" | tr '\n' ' ')"
          echo "mail.$DOMAIN: $(dig +short "mail.$DOMAIN" | tr '\n' ' ')"
          echo "Nameservers: $(dig +short NS "$DOMAIN" | tr '\n' ' ')"
          # Which MochaHost server hosts the domain today, so the right cPanel
          # account can be found: the address's reverse name and the name on
          # the certificate cPanel's port presents. Both are public.
          # Straight from the domain's own name server, so a change shows here
          # at once, while the answers above may still come from caches.
          ns="$(dig +short NS "$DOMAIN" | head -n 1)"
          if [ -n "$ns" ]; then
            echo "At the domain's name server $ns (no caches):"
            for n in "$DOMAIN" "www.$DOMAIN" "mail.$DOMAIN"; do
              echo "  $n: $(dig +short @"$ns" "$n" A | tr '\n' ' ')"
            done
            echo "  $DOMAIN MX: $(dig +short @"$ns" "$DOMAIN" MX | tr '\n' ' ')"
            echo "  $DOMAIN TXT: $(dig +short @"$ns" "$DOMAIN" TXT | tr '\n' ' ')"
            # Let's Encrypt prefers IPv6, and a CAA record can forbid it.
            for n in "$DOMAIN" "www.$DOMAIN"; do
              echo "  $n AAAA: $(dig +short @"$ns" "$n" AAAA | tr '\n' ' ')"
              echo "  $n CAA: $(dig +short @"$ns" "$n" CAA | tr '\n' ' ')"
            done
            echo "  $DOMAIN A record TTL (seconds caches may keep the old answer): $(dig +noall +answer @"$ns" "$DOMAIN" A | awk '{print $2}' | head -n 1)"
          fi
          # Every name server must give the same answer: Let's Encrypt may ask
          # any of them, and one that lags behind fails the certificate.
          echo "Each name server:"
          for s in $(dig +short NS "$DOMAIN" | sort); do
            echo "  $s $DOMAIN: $(dig +short @"$s" "$DOMAIN" A | tr '\n' ' ')| www: $(dig +short @"$s" "www.$DOMAIN" A | tr '\n' ' ')"
          done
          echo "Public resolvers (caches):"
          for r in 1.1.1.1 8.8.8.8 9.9.9.9 208.67.222.222; do
            echo "  $r $DOMAIN: $(dig +short @"$r" "$DOMAIN" A | tr '\n' ' ')| www: $(dig +short @"$r" "www.$DOMAIN" A | tr '\n' ' ')"
          done
          ip="$(dig +short "$DOMAIN" A | grep -E '^[0-9.]+$' | head -n 1)"
          if [ -n "$ip" ]; then
            echo "Server name of $ip: $(dig +short -x "$ip" | tr '\n' ' ')"
            echo "Certificate on $ip:2083: $(echo | timeout 15 openssl s_client -connect "$ip:2083" 2>/dev/null | openssl x509 -noout -subject 2>/dev/null)"
          fi
