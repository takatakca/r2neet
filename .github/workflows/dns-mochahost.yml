name: DNS (MochaHost)

# Point the domain at the VPS through cPanel's API, keeping email at
# MochaHost. Run `plan` first (read-only), then `email`, then `web`.
# See scripts/deploy/mochahost-dns.py for exactly what each phase changes.
# Needs MOCHAHOST_CPANEL_HOST, MOCHAHOST_CPANEL_USER and MOCHAHOST_CPANEL_TOKEN
# (cPanel > Security > Manage API Tokens) in the `production` environment.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain, e.g. r2nette.ca
        required: true
        type: string
      mode:
        description: plan (read-only), email, or web
        required: true
        type: choice
        options: [plan, email, web]

concurrency:
  group: dns-${{ inputs.domain }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dns:
    name: ${{ inputs.mode }}
    # Only main's scripts may run with root and cPanel credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ${{ inputs.mode }}
        env:
          MODE: ${{ inputs.mode }}
          DOMAIN: ${{ inputs.domain }}
          SERVER_IP: ${{ secrets.CONTABO_SSH_HOST }}
          CPANEL_HOST: ${{ secrets.MOCHAHOST_CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.MOCHAHOST_CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.MOCHAHOST_CPANEL_TOKEN }}
        run: python3 scripts/deploy/mochahost-dns.py

      - name: What the internet sees now
        if: always()
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          for t in A MX; do echo "$DOMAIN $t: $(dig +short "$DOMAIN" "$t" | tr '\n' ' ')"; done
          echo "www.$DOMAIN: $(dig +short "www.$DOMAIN" | tr '\n' ' ')"
          echo "mail.$DOMAIN: $(dig +short "mail.$DOMAIN" | tr '\n' ' ')"
          echo "Nameservers: $(dig +short NS "$DOMAIN" | tr '\n' ' ')"
          # Which MochaHost server hosts the domain today, so the right cPanel
          # account can be found: the address's reverse name and the name on
          # the certificate cPanel's port presents. Both are public.
          # Straight from the domain's own name server, so a change shows here
          # at once, while the answers above may still come from caches.
          ns="$(dig +short NS "$DOMAIN" | head -n 1)"
          if [ -n "$ns" ]; then
            echo "At the domain's name server $ns (no caches):"
            for n in "$DOMAIN" "www.$DOMAIN" "mail.$DOMAIN"; do
              echo "  $n: $(dig +short @"$ns" "$n" A | tr '\n' ' ')"
            done
            echo "  $DOMAIN MX: $(dig +short @"$ns" "$DOMAIN" MX | tr '\n' ' ')"
            echo "  $DOMAIN TXT: $(dig +short @"$ns" "$DOMAIN" TXT | tr '\n' ' ')"
            echo "  $DOMAIN A record TTL (seconds caches may keep the old answer): $(dig +noall +answer @"$ns" "$DOMAIN" A | awk '{print $2}' | head -n 1)"
          fi
          ip="$(dig +short "$DOMAIN" A | grep -E '^[0-9.]+$' | head -n 1)"
          if [ -n "$ip" ]; then
            echo "Server name of $ip: $(dig +short -x "$ip" | tr '\n' ' ')"
            echo "Certificate on $ip:2083: $(echo | timeout 15 openssl s_client -connect "$ip:2083" 2>/dev/null | openssl x509 -noout -subject 2>/dev/null)"
          fi
