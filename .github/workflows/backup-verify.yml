name: Restore drill

# An untested backup is a guess. This proves, on a schedule, that a dump can
# be restored into an empty database and that the application works against
# the restored copy.
on:
  schedule:
    - cron: '0 8 * * 1' # Mondays, 08:00 UTC
  workflow_dispatch:

jobs:
  drill:
    name: Backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r2nette_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/r2nette_test
      PRISMA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/r2nette_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/r2nette_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npx prisma generate
      - run: npx prisma migrate deploy
      - name: Install PostgreSQL 16 client
        run: |
          # The service is postgres:16. Ubuntu's default postgresql-client is
          # now 17+, and its pg_dump writes SET transaction_timeout, which
          # PostgreSQL 16 rejects on restore (Restore drill #41491577802).
          # Use the same PGDG client the production image pins.
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/keyrings/postgresql-pgdg.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/postgresql-pgdg.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          # The Ubuntu 26 runner already ships a newer client, and the bare
          # pg_dump wrapper picks the newest one (18.x, Restore drill
          # #42668676568). Put the 16 binaries first, here and for the drill.
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          pg_dump --version
          pg_restore --version
          pg_dump --version | grep -Eq ' 16\.'
          pg_restore --version | grep -Eq ' 16\.'

      - name: Run the drill
        run: npx vite-node scripts/restore-drill.ts
