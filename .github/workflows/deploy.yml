name: Deploy

# Runs only after the CI workflow succeeds for a push to main.
# Pull requests do not deploy. The image tag is the full commit SHA.
# "Run workflow" redeploys the current main, e.g. after the server's
# secrets are first added; only main can be deployed that way, and only once
# CI has passed on its current commit.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Lets "Run workflow" confirm that CI passed on the commit it deploys.
  actions: read

jobs:
  deploy:
    name: Deploy immutable image
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      # The workflow_run path only starts after CI succeeded. "Run workflow"
      # deploys whatever main points at now, so check CI passed on it first.
      - name: Require a passing CI run for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 100 \
            --json conclusion,event \
            --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "${passed:-0}" -gt 0 ]; then
            echo "CI passed for ${GITHUB_SHA}."
          else
            echo "::error::CI has not passed for ${GITHUB_SHA}. Wait for the CI run on main to finish green, then run this workflow again."
            exit 1
          fi

      # workflow_run jobs can be queued out of order. Never publish an older
      # commit after a newer one has reached main.
      - name: Skip a superseded release
        id: release-head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$MAIN_SHA" = "$EXPECTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping obsolete deployment: $EXPECTED_SHA; main is $MAIN_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the exact commit CI passed
        if: steps.release-head.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Build and push the immutable image
        if: steps.release-head.outputs.current == 'true'
        env:
          GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy/publish-image.sh

      - name: Install sshpass
        if: steps.release-head.outputs.current == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null

      # A new push may land while an image is being built. Check again at
      # the last safe moment before touching the production server.
      - name: Verify main before rolling the VPS
        id: roll-head
        if: steps.release-head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$MAIN_SHA" = "$EXPECTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping VPS roll of obsolete commit $EXPECTED_SHA; main is $MAIN_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll the VPS to that image
        if: steps.roll-head.outputs.current == 'true'
        env:
          GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CONTABO_SSH_HOST: ${{ secrets.CONTABO_SSH_HOST }}
          CONTABO_SSH_PORT: ${{ secrets.CONTABO_SSH_PORT }}
          CONTABO_SSH_USER: ${{ secrets.CONTABO_SSH_USER }}
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_SSH_KNOWN_HOSTS: ${{ secrets.CONTABO_SSH_KNOWN_HOSTS }}
          CONTABO_ROOT_PASSWORD: ${{ secrets.CONTABO_ROOT_PASSWORD }}
          CONTABO_ROOT_SSH_KEY: ${{ secrets.CONTABO_ROOT_SSH_KEY }}
          CONTABO_SSH_ADMIN_USER: ${{ secrets.CONTABO_SSH_ADMIN_USER }}
          GHCR_PULL_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy/ci-deploy.sh
